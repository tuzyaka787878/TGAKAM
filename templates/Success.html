<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Success</title>
  <style>
    body {
      margin: 0;
      background-color: #1c1c1c;
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
    }

    h2 {
      font-size: 26px;
      margin-bottom: 10px;
      color: #9b83e8;
    }

    .success-text {
      color: #b0b7c3;
      font-size: 18px;
      margin-bottom: 30px;
      text-align: center;
      max-width: 300px;
    }

    button {
      margin-top: 20px;
      padding: 14px;
      width: 100%;
      max-width: 320px;
      border: none;
      border-radius: 12px;
      background-color: #ff4444; /* Красный цвет */
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #cc0000; /* Более тёмный красный при наведении */
    }

    /* Стили для анимированной галочки */
    .checkmark-container {
      margin-bottom: 30px;
    }

    .checkmark-circle {
      stroke: #4CAF50; /* Зелёный цвет */
      stroke-width: 4;
      fill: none;
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }

    .checkmark-check {
      stroke: #4CAF50; /* Зелёный цвет */
      stroke-width: 4;
      fill: none;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
    }

    @keyframes stroke {
      100% {
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="checkmark-container">
      <svg width="80" height="80" viewBox="0 0 60 60">
        <circle class="checkmark-circle" cx="30" cy="30" r="25"/>
        <path class="checkmark-check" d="M20 30 l8 8 l14 -14"/>
      </svg>
    </div>

    <h2>Success!</h2>
    <div class="success-text">
      Your code has been successfully submitted.<br>Thank you for participating!
    </div>

    <button onclick="window.location.href='/'">Log Out</button>
  </div>
</body>
</html>
